<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平溪天燈 3D 模型</title>
<style>
  :root {
    --panel: rgba(22, 16, 30, 0.72);
    --text: #f7f1e8;
    --muted: #c4b8c6;
    --accent: #f2a23a;
    --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120e1c; color: var(--text);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  #hud {
    position: fixed; top: 16px; left: 16px; width: 310px; max-width: calc(100vw - 32px);
    padding: 16px 18px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); user-select: none;
  }
  h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: 0.04em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  #clock { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #date { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 5px 0;
    border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .row span:first-child { color: var(--muted); }
  .modes { display: flex; gap: 6px; margin-top: 10px; }
  .modes + .modes { margin-bottom: 8px; }
  button {
    flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line); background: transparent;
    color: var(--text); font: inherit; font-size: 13px; cursor: pointer;
  }
  button.on { background: var(--accent); border-color: var(--accent); color: #2a1604; font-weight: 600; }
  button.act { border-color: var(--accent); color: var(--accent); }
  button.act:active { background: var(--accent); color: #2a1604; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px;
    color: var(--muted); background: var(--panel); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
  @media (max-width: 520px) {
    #hud { padding: 12px 14px; top: auto; bottom: 16px; }
    #clock { font-size: 26px; }
    .sub, #hint { display: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <h1>平溪天燈 即時 3D 微縮模型</h1>
  <div class="sub">十分老街 · 平溪線火車穿街而過 · 靜安吊橋 · 依當地時間即時變換日夜</div>
  <div id="clock">--:--:--</div>
  <div id="date">----/--/--</div>
  <div class="row"><span>時段</span><span id="phase">-</span></div>
  <div class="row"><span>今日日落</span><span id="sunset">-</span></div>
  <div class="row"><span>空中天燈</span><span id="count">-</span></div>
  <div class="row"><span>平溪線火車</span><span id="train">-</span></div>
  <div class="modes">
    <button id="mLive" class="on">即時</button>
    <button id="mFast">快轉</button>
    <button id="mSpin" class="on">自轉</button>
  </div>
  <div class="modes">
    <button id="aOne" class="act">放一盞天燈</button>
    <button id="aFest" class="act">元宵祈福</button>
  </div>
  <input id="slider" type="range" min="0" max="24" step="0.05" value="12" aria-label="當地時間">
</div>
<div id="hint">拖曳旋轉 · 滾輪/雙指縮放 · 拖動滑桿調整時間</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// 比例：1 單位 ≈ 4 公尺；鐵道沿 x 軸穿過十分老街，基隆河在南側（+z）
const LAT = 25.0436, LON = 121.7748;
const WEEK_NAMES = '日一二三四五六';

// ---------- 場景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8ec5ea, 150, 420);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.5, 2000);
camera.position.set(50, 32, 26).multiplyScalar(Math.max(1, 0.85 / camera.aspect));   // 直式螢幕拉遠
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, camera.aspect < 0.8 ? 6 : 15, 2);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 10;
controls.maxDistance = 200;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x3a3328, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 400 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const moon = new THREE.DirectionalLight(0x6f8cff, 0);
moon.position.set(-50, 90, -40);
scene.add(moon);

// ---------- 貼圖 ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}
// 四色天燈：每面一色、一個祈願字
const lanternTex = canvasTex(512, 128, (g, w, h) => {
  const faces = [['#e8322a', '平'], ['#f5c534', '安'], ['#f07aa0', '福'], ['#f08a2a', '願']];
  faces.forEach(([c, ch], i) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, c); gr.addColorStop(1, '#fff2d0');
    g.fillStyle = gr; g.fillRect(i * 128, 0, 128, h);
    g.fillStyle = 'rgba(40,20,10,0.85)';
    g.font = 'bold 78px "Noto Serif TC", "PMingLiU", serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(ch, i * 128 + 64, h / 2 + 4);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(i * 128, 0, 2, h);
  });
});
lanternTex.wrapS = THREE.ClampToEdgeWrapping;
const winTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3d3a38';
  for (let y = 10; y < h; y += 28) for (let x = 8; x < w; x += 22) g.fillRect(x, y, 10, 12);
});
const winGlow = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  for (let y = 10; y < h; y += 28) for (let x = 8; x < w; x += 22)
    if (Math.random() < 0.7) { g.fillStyle = '#ffcc80'; g.fillRect(x, y, 10, 12); }
});
const trainTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = '#f4f4f0'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1f4fa0'; g.fillRect(0, 40, w, 12);
  g.fillStyle = '#f08a1c'; g.fillRect(0, 36, w, 3);
  g.fillStyle = '#26303a';
  for (let x = 10; x < w - 20; x += 30) g.fillRect(x, 12, 22, 18);
});
const waterNormal = (() => {
  const N = 128, c = document.createElement('canvas');
  c.width = c.height = N;
  const g = c.getContext('2d'), img = g.createImageData(N, N);
  const waves = Array.from({ length: 8 }, () => ({ fx: (Math.random() * 6 | 0) - 3, fy: (Math.random() * 6 | 0) + 1, p: Math.random() * 6.28, a: 0.5 + Math.random() }));
  const hh = (x, y) => waves.reduce((s, w) => s + w.a * Math.sin(2 * Math.PI * (w.fx * x + w.fy * y) / N + w.p), 0);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const v = new THREE.Vector3(-(hh(x + 1, y) - hh(x - 1, y)), -(hh(x, y + 1) - hh(x, y - 1)), 3).normalize(), i = (y * N + x) * 4;
    img.data[i] = (v.x * 0.5 + 0.5) * 255; img.data[i + 1] = (v.y * 0.5 + 0.5) * 255; img.data[i + 2] = (v.z * 0.5 + 0.5) * 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  return t;
})();

// ---------- 山谷地形 ----------
const R = 60, GROUND = 1.2;
const ss = THREE.MathUtils.smoothstep;
const riverZ = x => 15 + 3 * Math.sin(x * 0.05);
function height(x, z) {
  const noise = Math.sin(x * 0.15) * Math.cos(z * 0.12) * 2 + Math.sin(x * 0.05 + z * 0.08) * 3;
  if (z < 0) return GROUND + 30 * ss(-z, 9, 52) + noise * ss(-z, 9, 18);
  const rz = riverZ(x), dz = Math.abs(z - rz);
  const bank = dz < 5 ? THREE.MathUtils.lerp(-1.6, GROUND, ss(dz, 2.5, 5)) : GROUND;
  const far = Math.max(0, z - rz - 6);
  return bank + 30 * ss(far, 0, 38) + noise * ss(far, 0, 8);
}
const RINGS = 80, SEGS = 200;
const tPos = [], tCol = [], tIdx = [];
const cG1 = new THREE.Color(0x3f6e34), cG2 = new THREE.Color(0x5b8a3f), cRock = new THREE.Color(0x77705f),
  cPath = new THREE.Color(0x8d8473), cSand = new THREE.Color(0x9c8f72), cSoil = new THREE.Color(0x4a3426), col = new THREE.Color();
for (let i = 0; i <= RINGS + 1; i++) {
  const r = Math.min(i, RINGS) / RINGS * R;
  for (let j = 0; j < SEGS; j++) {
    const a = j / SEGS * Math.PI * 2, x = Math.cos(a) * r, z = Math.sin(a) * r;
    const skirt = i === RINGS + 1, y = skirt ? -0.3 : height(x, z);
    tPos.push(x, y, z);
    if (skirt) col.copy(cSoil);
    else if (y < 0.6) col.copy(cSand);
    else if (y < GROUND + 0.3) col.copy(cPath);
    else {
      const slope = Math.abs(height(x + 0.5, z) - height(x - 0.5, z)) + Math.abs(height(x, z + 0.5) - height(x, z - 0.5));
      col.copy(cG1).lerp(cG2, 0.5 + 0.5 * Math.sin(x * 0.3) * Math.cos(z * 0.4)).lerp(cRock, ss(slope, 1.6, 3));
    }
    tCol.push(col.r, col.g, col.b);
  }
}
for (let i = 0; i < RINGS + 1; i++) for (let j = 0; j < SEGS; j++) {
  const a = i * SEGS + j, b = i * SEGS + (j + 1) % SEGS, c = a + SEGS, d = b + SEGS;
  tIdx.push(a, b, c, b, d, c);
}
const terrainGeo = new THREE.BufferGeometry();
terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(tPos, 3));
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(tCol, 3));
terrainGeo.setIndex(tIdx);
terrainGeo.computeVertexNormals();
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, flatShading: true }));
terrain.castShadow = terrain.receiveShadow = true;
scene.add(terrain);
const plinth = new THREE.Mesh(new THREE.CylinderGeometry(R + 1, R + 2.5, 5, 128), new THREE.MeshStandardMaterial({ color: 0x3b2618, roughness: 0.55 }));
plinth.position.y = -2.85;
scene.add(plinth);
const river = new THREE.Mesh(new THREE.CircleGeometry(R + 0.3, 128), new THREE.MeshStandardMaterial({
  color: 0x4f7a5c, roughness: 0.15, metalness: 0.1, normalMap: waterNormal, normalScale: new THREE.Vector2(0.5, 0.5) }));
river.rotation.x = -Math.PI / 2;
waterNormal.repeat.set(16, 16);
scene.add(river);

// 山坡樹林
const mtx = new THREE.Matrix4(), quat = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
const treeSpots = [];
for (let k = 0; k < 2600 && treeSpots.length < 650; k++) {
  const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * (R - 3);
  const x = Math.cos(a) * r, z = Math.sin(a) * r, y = height(x, z);
  if (y < GROUND + 1.5) continue;
  treeSpots.push([x, y, z]);
}
const trees = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1.4, 0),
  new THREE.MeshStandardMaterial({ roughness: 0.9, flatShading: true }), treeSpots.length);
treeSpots.forEach(([x, y, z], i) => {
  const s = 0.7 + Math.random() * 0.9;
  mtx.compose(new THREE.Vector3(x, y + s, z), quat.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 6), new THREE.Vector3(s, s * 1.3, s));
  trees.setMatrixAt(i, mtx);
  trees.setColorAt(i, col.setHSL(0.27 + Math.random() * 0.06, 0.5, 0.16 + Math.random() * 0.1));
});
trees.castShadow = true;
scene.add(trees);

// ---------- 平溪線鐵道（穿過老街正中央） ----------
const TRACK_END = R - 2;
const railMat = new THREE.MeshStandardMaterial({ color: 0x8a8d90, metalness: 0.8, roughness: 0.35 });
for (const z of [-0.55, 0.55]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(TRACK_END * 2, 0.14, 0.1), railMat);
  rail.position.set(0, GROUND + 0.2, z);
  scene.add(rail);
}
const nSl = Math.floor(TRACK_END * 2 / 0.8);
const sleepers = new THREE.InstancedMesh(new THREE.BoxGeometry(0.3, 0.12, 1.7), new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 }), nSl);
for (let i = 0; i < nSl; i++) {
  mtx.compose(new THREE.Vector3(-TRACK_END + i * 0.8, GROUND + 0.08, 0), quat.identity(), one);
  sleepers.setMatrixAt(i, mtx);
}
sleepers.receiveShadow = true;
scene.add(sleepers);

// ---------- 十分老街：鐵道兩側的店家 ----------
const shops = [];
for (let x = -42; x < 42; x += 3.4) for (const s of [-1, 1]) {
  if (Math.abs(x - 20) < 3 && s > 0) continue;            // 往吊橋的路口
  shops.push({ x: x + (Math.random() - 0.5) * 0.4, z: s * 4.3, w: 3.1, d: 3.2, floors: 2 + (Math.random() < 0.35 ? 1 : 0), s });
}
const glowMats = [];
const wallMat = new THREE.MeshStandardMaterial({ map: winTex, emissiveMap: winGlow, emissive: 0xffffff, emissiveIntensity: 0, roughness: 0.85 });
glowMats.push(wallMat);
const walls = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), wallMat, shops.length);
const roofs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x4a4a4c, roughness: 0.8 }), shops.length);
const signMat = new THREE.MeshStandardMaterial({ roughness: 0.6, emissive: 0xffffff, emissiveIntensity: 0 });
glowMats.push(signMat);
const signs = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), signMat, shops.length);
const WALLS = [0xd8cdb8, 0xb9a88f, 0x9a5a44, 0xc7c1b5, 0x8c8478, 0xe2d9c6];
const SIGNS = [0xd9302a, 0xf2b630, 0x2a7ad9, 0x2aa35a, 0xf06a9a];
shops.forEach((h, i) => {
  const hgt = h.floors * 1.6;
  mtx.compose(new THREE.Vector3(h.x, GROUND + hgt / 2, h.z), quat.identity(), new THREE.Vector3(h.w, hgt, h.d));
  walls.setMatrixAt(i, mtx);
  walls.setColorAt(i, col.setHex(WALLS[Math.random() * WALLS.length | 0]));
  mtx.compose(new THREE.Vector3(h.x, GROUND + hgt + 0.15, h.z), quat, new THREE.Vector3(h.w + 0.3, 0.3, h.d + 0.3));
  roofs.setMatrixAt(i, mtx);
  mtx.compose(new THREE.Vector3(h.x, GROUND + 1.9, h.z - h.s * (h.d / 2 + 0.06)), quat, new THREE.Vector3(h.w * 0.8, 0.6, 0.08));
  signs.setMatrixAt(i, mtx);
  signs.setColorAt(i, col.setHex(SIGNS[Math.random() * SIGNS.length | 0]));
});
walls.castShadow = walls.receiveShadow = roofs.castShadow = true;
scene.add(walls, roofs, signs);

// 掛在老街上的小燈籠串
const streetLampPts = [];
for (let x = -40; x < 40; x += 1.8) for (const s of [-1, 1]) streetLampPts.push(new THREE.Vector3(x, GROUND + 2.6, s * 2.55));
const miniMat = new THREE.MeshStandardMaterial({ color: 0xd8322a, emissive: 0xff2a10, emissiveIntensity: 0.1 });
const minis = new THREE.InstancedMesh(new THREE.SphereGeometry(0.18, 10, 8), miniMat, streetLampPts.length);
streetLampPts.forEach((p, i) => { mtx.compose(p, quat.identity(), new THREE.Vector3(1, 1.25, 1)); minis.setMatrixAt(i, mtx); });
scene.add(minis);

// ---------- 靜安吊橋 ----------
{
  const BX = 20, z0 = 8.5, z1 = riverZ(BX) + 7, deckY = GROUND + 1.2;
  const woodMat = new THREE.MeshStandardMaterial({ color: 0x7a5434, roughness: 0.85 });
  const towerMat = new THREE.MeshStandardMaterial({ color: 0xb03a2e, roughness: 0.6 });
  const deck = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, z1 - z0), woodMat);
  deck.position.set(BX, deckY, (z0 + z1) / 2);
  deck.castShadow = deck.receiveShadow = true;
  scene.add(deck);
  const cable = [];
  for (const sx of [-0.85, 0.85]) {
    for (const z of [z0, z1]) {
      const tw = new THREE.Mesh(new THREE.BoxGeometry(0.3, 4, 0.3), towerMat);
      tw.position.set(BX + sx, deckY + 1.9, z);
      tw.castShadow = true;
      scene.add(tw);
    }
    const pts = [];
    for (let i = 0; i <= 30; i++) {
      const t = i / 30, z = z0 + (z1 - z0) * t;
      const y = deckY + 3.8 - 3.0 * 4 * t * (1 - t);       // 懸索拋物線
      pts.push(new THREE.Vector3(BX + sx, y, z));
      if (i % 2 === 0 && i > 0 && i < 30) cable.push(new THREE.Vector3(BX + sx, y, z), new THREE.Vector3(BX + sx, deckY, z));
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x2a2a2a })));
  }
  scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(cable), new THREE.LineBasicMaterial({ color: 0x3a3a3a })));
  const path = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 3), new THREE.MeshStandardMaterial({ color: 0x8d8473 }));
  path.position.set(BX, GROUND + 0.05, 6.5);
  scene.add(path);
}

// ---------- 平溪線火車 ----------
const train = new THREE.Group();
const carMat = new THREE.MeshStandardMaterial({ map: trainTex, roughness: 0.4, metalness: 0.2 });
const cars = [];
for (let c = 0; c < 3; c++) {
  const car = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(9.6, 2.3, 2.5), carMat);
  body.position.y = 1.45;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(9.4, 0.2, 2.3), new THREE.MeshStandardMaterial({ color: 0x9aa0a6 }));
  roof.position.y = 2.7;
  const under = new THREE.Mesh(new THREE.BoxGeometry(8.6, 0.35, 1.8), new THREE.MeshStandardMaterial({ color: 0x2a2a2c }));
  under.position.y = 0.2;
  car.add(body, roof, under);
  car.traverse(o => { if (o.isMesh) o.castShadow = true; });
  car.userData.offset = c * 10;
  cars.push(car);
  train.add(car);
}
const headMat = new THREE.MeshBasicMaterial({ color: 0xfff2c0 });
const heads = [-1, 1].map(s => {
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), headMat);
  l.position.set(s * 4.82, 0.9, 0);
  return l;
});
train.position.y = GROUND + 0.25;
scene.add(train);
const TRAIN_PERIOD = 80, TRAIN_SPEED = 8, TRAIN_RUN = (2 * (R + 12)) / TRAIN_SPEED;

// ---------- 天燈（粒子池） ----------
const L_MAX = 500;
const lanternGeo = new THREE.CylinderGeometry(0.56, 0.42, 1.35, 4, 1, false, Math.PI / 4);
const lanternMat = new THREE.MeshStandardMaterial({ map: lanternTex, emissiveMap: lanternTex, emissive: 0xffa860, emissiveIntensity: 0.2, roughness: 0.7 });
const lanterns = new THREE.InstancedMesh(lanternGeo, lanternMat, L_MAX);
lanterns.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
lanterns.frustumCulled = false;
scene.add(lanterns);
const L = Array.from({ length: L_MAX }, () => ({ on: false, p: new THREE.Vector3(), v: 0, vmax: 0, rot: 0, spin: 0, ph: 0, age: 0 }));
const zero = new THREE.Matrix4().makeScale(0, 0, 0);
for (let i = 0; i < L_MAX; i++) lanterns.setMatrixAt(i, zero);
let lNext = 0, airborne = 0;
function release(x, z) {
  const l = L[lNext];
  lNext = (lNext + 1) % L_MAX;
  Object.assign(l, { on: true, v: 0.15, vmax: 1.4 + Math.random() * 0.9, rot: Math.random() * 6.28,
    spin: (Math.random() - 0.5) * 0.4, ph: Math.random() * 6.28, age: 0 });
  l.p.set(x ?? (-24 + Math.random() * 48), GROUND + 1.0, z ?? (Math.random() - 0.5) * 1.6);
}
let festival = 0;
const $ = id => document.getElementById(id);
$('aOne').onclick = () => release((Math.random() - 0.5) * 10, 0);
$('aFest').onclick = () => { festival = 120; };   // 元宵：120 盞齊放
const eul = new THREE.Euler(), sc = new THREE.Vector3();
function updateLanterns(dt, now) {
  const wx = 0.5 + 0.4 * Math.sin(now * 0.05), wz = 0.35 * Math.cos(now * 0.07);
  airborne = 0;
  for (let i = 0; i < L_MAX; i++) {
    const l = L[i];
    if (!l.on) continue;
    l.age += dt;
    l.v = Math.min(l.vmax, l.v + 0.45 * dt);
    const lift = ss(l.p.y, GROUND + 2, 25);                 // 越高風越大
    l.p.x += (wx * lift + Math.sin(now * 0.6 + l.ph) * 0.08) * dt;
    l.p.z += (wz * lift + Math.cos(now * 0.5 + l.ph) * 0.08) * dt;
    l.p.y += l.v * dt;
    l.rot += l.spin * dt;
    const fade = 1 - ss(l.p.y, 70, 90);
    if (fade <= 0) { l.on = false; lanterns.setMatrixAt(i, zero); continue; }
    airborne++;
    eul.set(Math.sin(now * 0.9 + l.ph) * 0.06, l.rot, Math.cos(now * 0.8 + l.ph) * 0.06);
    const s = Math.min(1, l.age * 3) * fade;
    mtx.compose(l.p, quat.setFromEuler(eul), sc.set(s, s, s));
    lanterns.setMatrixAt(i, mtx);
  }
  lanterns.instanceMatrix.needsUpdate = true;
}

// ---------- 星空 ----------
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(1500 * 3);
for (let i = 0; i < 1500; i++) {
  const v = new THREE.Vector3().randomDirection();
  v.y = Math.abs(v.y) + 0.05;
  v.normalize().multiplyScalar(800);
  starPos.set([v.x, v.y, v.z], i * 3);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- 後製光暈 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.8);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- 時間與太陽位置 ----------
const TPE = 8 * 3600e3;
function local(ms) {
  const d = new Date(ms + TPE);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth(), d: d.getUTCDate(), wd: d.getUTCDay(),
    h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds() };
}
function sunPosition(ms) {
  const t = local(ms);
  const n = (Date.UTC(t.y, t.mo, t.d) - Date.UTC(t.y, 0, 0)) / 864e5;
  const decl = THREE.MathUtils.degToRad(23.44) * Math.sin(2 * Math.PI * (284 + n) / 365);
  const B = 2 * Math.PI * (n - 81) / 364;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const utcH = ((ms / 3600e3) % 24 + 24) % 24;
  const H = THREE.MathUtils.degToRad(15 * (utcH + LON / 15 + eot / 60 - 12));
  const phi = THREE.MathUtils.degToRad(LAT);
  const alt = Math.asin(Math.sin(phi) * Math.sin(decl) + Math.cos(phi) * Math.cos(decl) * Math.cos(H));
  const az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(decl) * Math.cos(phi));
  return { alt, dir: new THREE.Vector3(-Math.sin(az) * Math.cos(alt), Math.sin(alt), Math.cos(az) * Math.cos(alt)) };
}
const dayStart = ms => { const t = local(ms); return Date.UTC(t.y, t.mo, t.d) - TPE; };
let sunsetCache = { day: 0, ms: 0 };
function sunsetOf(ms) {
  const d0 = dayStart(ms);
  if (sunsetCache.day !== d0) {
    let m = d0 + 15 * 3600e3;
    const limit = THREE.MathUtils.degToRad(-0.833);
    while (m < d0 + 21 * 3600e3 && sunPosition(m).alt > limit) m += 60e3;
    sunsetCache = { day: d0, ms: m };
  }
  return sunsetCache.ms;
}

// ---------- 介面 ----------
let mode = 'live', simMs = Date.now();
const setMode = m => { mode = m; $('mLive').classList.toggle('on', m === 'live'); $('mFast').classList.toggle('on', m === 'fast'); };
$('mLive').onclick = () => setMode('live');
$('mFast').onclick = () => setMode(mode === 'fast' ? 'live' : 'fast');
$('mSpin').onclick = () => { controls.autoRotate = !controls.autoRotate; $('mSpin').classList.toggle('on', controls.autoRotate); };
$('slider').oninput = e => { simMs = dayStart(simMs) + parseFloat(e.target.value) * 3600e3; setMode('manual'); };
const pad = v => String(v).padStart(2, '0');

// 開場先放幾盞，畫面不會空著
for (let k = 0; k < 14; k++) {
  release();
  const l = L[(lNext + L_MAX - 1) % L_MAX];
  l.p.y = 4 + Math.random() * 45; l.v = l.vmax; l.age = 1;
}

// ---------- 動畫 ----------
const C = h => new THREE.Color(h);
const SKY_DAY = C(0x8ec5ea), SKY_DUSK = C(0xe98a6a), SKY_NIGHT = C(0x0e0d24);
const SUN_LOW = C(0xff8a4a), SUN_HIGH = C(0xfff4e0);
const sky = new THREE.Color();
const clock = new THREE.Clock();
let lastHud = 0, autoAcc = 0;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.1), now = clock.elapsedTime;
  if (mode === 'live') simMs = Date.now();
  else if (mode === 'fast') simMs += dt * 1800e3;     // 1 秒 = 30 分鐘

  const { alt, dir } = sunPosition(simMs);
  const e = THREE.MathUtils.radToDeg(alt);
  const day = ss(e, -6, 10), night = 1 - ss(e, -8, 3);
  const dusk = Math.max(0, 1 - Math.abs(e - 1) / 10);

  sky.copy(SKY_NIGHT).lerp(SKY_DAY, day).lerp(SKY_DUSK, dusk * 0.65);
  scene.background = sky;
  scene.fog.color.copy(sky);
  sun.position.copy(dir).multiplyScalar(200);
  sun.intensity = 2.4 * ss(e, -1, 12);
  sun.color.copy(SUN_LOW).lerp(SUN_HIGH, ss(e, 0, 25));
  hemi.intensity = 0.12 + 0.85 * day;
  scene.environmentIntensity = 0.06 + 0.94 * day;
  moon.intensity = 0.22 * night;
  starMat.opacity = night * 0.9;
  river.material.color.setHex(0x4f7a5c).lerp(sky, 0.3).multiplyScalar(0.4 + 0.6 * day);
  waterNormal.offset.set(now * 0.03, 0);

  const lit = 1 - ss(e, -2, 6);
  lanternMat.emissiveIntensity = 0.2 + 0.95 * lit * (0.92 + 0.08 * Math.sin(now * 13));   // 燭火微微閃動
  miniMat.emissiveIntensity = 0.1 + 1.6 * lit;
  for (const m of glowMats) m.emissiveIntensity = night * (m === signMat ? 0.6 : 1.0);
  headMat.color.setScalar(0.6 + 2.5 * lit);
  bloom.strength = 0.15 + 0.6 * lit + 0.2 * dusk;

  // 平溪線火車：每 80 秒一班，方向輪流
  const cyc = now % TRAIN_PERIOD, dirT = Math.floor(now / TRAIN_PERIOD) % 2 ? -1 : 1;
  const running = cyc < TRAIN_RUN;
  let trainX = 999;
  if (running) {
    trainX = dirT * (-(R + 12) + cyc * TRAIN_SPEED);
    for (const car of cars) {
      const x = trainX - dirT * car.userData.offset;
      car.position.x = x;
      car.visible = Math.abs(x) < TRACK_END - 4.5;
    }
    const lead = cars[0];
    heads.forEach((h, k) => { if (h.parent !== lead) lead.add(h); h.visible = (k === 1) === (dirT > 0); });
  }
  train.visible = running;

  // 自動放天燈（火車經過老街時暫停）
  const trainNear = running && Math.abs(trainX) < 40;
  autoAcc += dt * (trainNear ? 0 : 0.35 + 0.5 * lit);
  while (autoAcc >= 1) { autoAcc--; release(); }
  if (festival > 0) {
    const n = Math.min(festival, Math.ceil(dt * 30));
    for (let k = 0; k < n; k++) release(-30 + Math.random() * 60, (Math.random() - 0.5) * 3);
    festival -= n;
  }
  updateLanterns(dt, now);

  if (now - lastHud > 0.2) {
    lastHud = now;
    const t = local(simMs), st = local(sunsetOf(simMs));
    $('clock').textContent = `${pad(t.h)}:${pad(t.mi)}:${pad(t.s)}`;
    const tag = { live: '', fast: '· 快轉中', manual: '· 手動' }[mode];
    $('date').textContent = `平溪 ${t.y}/${pad(t.mo + 1)}/${pad(t.d)}（${WEEK_NAMES[t.wd]}）${tag}`;
    $('phase').textContent = e > 6 ? '白天' : e > -0.8 ? (t.h < 12 ? '日出' : '夕陽') : e > -6 ? '暮光' : '夜晚';
    $('sunset').textContent = `${pad(st.h)}:${pad(st.mi)}`;
    $('count').textContent = `${airborne} 盞`;
    $('train').textContent = running ? (trainNear ? '通過老街中，請退到兩旁' : '行駛中') : `${Math.ceil(TRAIN_PERIOD - cyc)} 秒後進站`;
    if (mode !== 'manual') $('slider').value = t.h + t.mi / 60;
  }

  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}
frame();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
